<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Coder</title>

    <!-- Icons -->
    <link rel="icon" href="{{ url_for('root_static', filename='favicon.ico') }}" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('root_static', filename='favicon.svg') }}" />
    <link rel="apple-touch-icon" href="{{ url_for('root_static', filename='apple-touch-icon.png') }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='projects/qrcoder/style.css') }}">
</head>

<body>
    <main class="card">
        <h1>QR Coder</h1>
        <p class="subtitle">Turn a URL into a scannable QR code.</p>

        <form id="qr-form">
            <label for="url-input" class="sr-only">URL</label>
            <input
                   type="url"
                   id="url-input"
                   name="url"
                   placeholder="https://example.com"
                   autocomplete="off"
                   required>

            <div class="actions">
                <button type="submit" id="generate-btn">Generate</button>
                <button type="button" id="restart-btn">Restart</button>
            </div>
        </form>

        <p id="error-message" class="error" hidden></p>

        <div id="qrcode" class="qrcode"></div>

        <a id="download-btn" class="download-btn" download="qrcode.png" hidden>Download</a>
    </main>

    <script src="{{ url_for('static', filename='projects/qrcoder/qrcode.js') }}"></script>
    <script src="{{ url_for('static', filename='projects/qrcoder/app.js') }}"></script>
</body>

</html>
