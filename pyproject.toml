[project]
name = "joshbduncan-blog"
version = "0.1.0"
requires-python = ">=3.13.0"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "flask>=3.1.3",
    "flask-flatpages>=0.8.3",
    "frozen-flask>=1.0.2",
    "markdown>=3.10.2",
    "pygments>=2.19.2",
    "python-dotenv>=1.2.1",
    "werkzeug>=3.1.6",
]

[dependency-groups]
lint = ["ruff"]
type_check = ["ty"]
